  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    
    <symbol id="cuerpo-base" viewBox="0 0 100 80">
      <line x1="0" y1="40" x2="65" y2="40" stroke="black" stroke-width="2" />
      <line x1= "65" y1="25" x2="65" y2="55" stroke="black" stroke-width="3" />
      <line x1="65" y1="35" x2="85" y2="15" stroke="black" stroke-width="2" />
      <line x1="65" y1="45" x2="85" y2="65" stroke="black" stroke-width="2" />
      <line x1="85" y1="15" x2="85" y2="0" stroke="black" stroke-width="2" />
      <line x1="85" y1="65" x2="85" y2="80" stroke="black" stroke-width="2" />
    </symbol>

    <symbol id="flecha-base" overflow="visible">
      <polygon points="0,0 -10,-4 -10,4" fill="black" />
    </symbol>

    <symbol id="pnp" viewBox="0 0 100 80">
      <use href="#cuerpo-base"></use>
      <use href="#flecha-base" transform="translate(65,35) rotate(135)"></use>
    </symbol>
	
    <symbol id="npn" viewBox="0 0 100 80">
      <use href="#cuerpo-base"></use>
      <use href="#flecha-base" transform="translate(85,65) rotate(45)"></use>
    </symbol>

    <symbol id="transistor1" viewBox="0 0 100 80">
      <use href="#cuerpo-base"></use>
      <use href="#flecha-base" transform="translate(65, 40) rotate(0)"></use>
    </symbol>

     <symbol id="transistor2" viewBox="0 0 100 80">
      <use href="#cuerpo-base"></use>
      <use href="#flecha-base" transform="translate(85,15) rotate(315)"></use>
    </symbol>

     <symbol id="transistor3" viewBox="0 0 100 80">
      <use href="#cuerpo-base"></use>
      <use href="#flecha-base" transform="translate(85,5) rotate(270)"></use>
    </symbol>

    <symbol id="or-gate" viewBox="0 0 100 80">
      <line x1="75" y1="55" x2="85" y2="55" stroke="black" stroke-width="2" />
      <line x1="75" y1="25" x2="85" y2="25" stroke="black" stroke-width="2" />
      <line x1="85" y1="25" x2="85" y2="0" stroke="black" stroke-width="2" />
      <line x1="85" y1="55" x2="85" y2="80" stroke="black" stroke-width="2" />
      <line x1="0" y1="40" x2="15" y2="40" stroke="black" stroke-width="2" />
      <path d="M 80,15 Q 70,40 80,65 Q 40,65 15,40 Q 40,15 80,15" fill="none" stroke="black" stroke-width="2"/>
    </symbol>
    
  </svg>
