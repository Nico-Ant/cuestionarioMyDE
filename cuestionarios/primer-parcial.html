<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario - Primer parcial</title>
    <link rel="stylesheet" href="../estilos.css">

    <style>
        .btn-check {
            display: none !important;
        }
    </style>
</head>
<body>
    <header class="header-top">
        <h1 class="titulo-examen">Primer Parcial</h1>
    </header>

    <div id="contenedor-preguntas"></div>

    <script src="../datos/datos-capacitores.js"></script>
    <script src="../datos/datos-led.js"></script>
    <script src="../datos/datos-rectificadores.js"></script>
    <script src="../datos/datos-resistores.js"></script>
    <script src="../datos/datos-semiconductores.js"></script>
    <script src="../datos/datos-transformadores.js"></script>

    <script src="../script.js"></script>

    <button id="btn-subir" class="btn-subir" onclick="irArriba()" title="Ir arriba">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <div class="barra-inferior">
        <button id="btn-final" class="btn-finalizar" onclick="verificarTodo()">Verificar todo</button>
        <div id="resultado-final" style="font-size: 1.3rem; font-weight: bold; margin: 0;"></div>
    </div>

    <script>
        window.preguntas = [
            ...(typeof preguntasCapacitores !== 'undefined' ? preguntasCapacitores : []),
            ...(typeof preguntasLed !== 'undefined' ? preguntasLed : []),
            ...(typeof preguntasRectificadores !== 'undefined' ? preguntasRectificadores : []),
            ...(typeof preguntasResistores !== 'undefined' ? preguntasResistores : []),
            ...(typeof preguntasSemiconductores !== 'undefined' ? preguntasSemiconductores : []),
            ...(typeof preguntasTransformadores !== 'undefined' ? preguntasTransformadores : [])
        ];

        // Mezclamos el orden de las preguntas
        mezclarArray(window.preguntas);

        // Cargamos el examen
        window.onload = cargarExamen;
    </script>
</body>
</html>
